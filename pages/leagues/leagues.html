<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open FPL Insights</title>
    <link rel="icon" href="../../assets/favicon.png" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- AgGrid CSS -->
    <link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.2.1/styles/ag-grid.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.2.1/styles/ag-theme-alpine.css" rel="stylesheet">
    <!-- Fontawesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="leagues.css">
</head>

<body>
    <!-- Global Loader -->
    <div id="global-loader" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #121212; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.3s ease-out;">
        <div class="spinner-border text-success mb-4" role="status" style="width: 4rem; height: 4rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
        <h5 id="global-progress-task" class="text-white mb-2">Connecting to FPL...</h5>
        <div class="progress w-50 border border-secondary" style="height: 25px; max-width: 400px; background-color: #2c2c2c;">
            <div id="global-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success text-center fw-bold" role="progressbar" style="width: 0%; line-height: 23px;">
                <span id="global-progress-text">0%</span>
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand" href="../../index.html">Open FPL Insights</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="../../index.html">Team</a>
                    </li>
                    <li class="nav-item" id="nav-managers-tab" style="display: none;">
                        <a class="nav-link" href="../managers/managers.html">Managers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../fdr/fdr.html">Fixture Ticker</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../planner/planner.html">Planner</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../tools/tools.html">Tools</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../fixtures/fixtures.html">Fixtures</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="../leagues/leagues.html">Leagues</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-md-4">
                <input type="text" id="leagueId" class="form-control" placeholder="Enter League ID">
            </div>
            <div class="col-md-4">
                <button id="addLeagueBtn" class="btn btn-primary">Add League</button>
            </div>
        </div>

        <!-- League Names Grid -->
        <div id="playerLeaguesContainer" class="ag-theme-alpine-dark mb-5" style="height: 200px; width: 100%;"></div>


        <!-- League Standings Grid -->
        <div id="leagueStandingsContainer" class="ag-theme-alpine-dark" style="height: 400px; width: 100%;"></div>
    </div>

    <!-- JavaScript Dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AgGrid JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.2.1/dist/ag-grid-community.min.js"></script>

    <!-- Custom JS -->
    <script src="../../api/requests.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="../../data.js"></script>
    <script src="leagues.js"></script>
</body>

</html>
