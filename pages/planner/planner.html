<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer & Chip Planner - Open FPL Insights</title>
    <link rel="icon" href="../../assets/favicon.png" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fontawesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../../style.css" rel="stylesheet">
    <link href="planner.css" rel="stylesheet">
</head>
<body class="planner-page" style="background-color: #121212;">
    <!-- Global Loader -->
    <div id="global-loader" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #121212; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.3s ease-out;">
        <div class="spinner-border text-success" role="status" style="width: 4rem; height: 4rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
        <h4 class="mt-4 text-white">Loading FPL Data... <span id="global-progress-text"></span></h4>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand" href="../../index.html">Open FPL Insights</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="../../index.html">Team</a>
                    </li>
                    <li class="nav-item" id="nav-managers-tab" style="display: none;">
                        <a class="nav-link" href="../managers/managers.html">Managers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../fdr/fdr.html">Fixture Ticker</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="../planner/planner.html">Planner</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../tools/tools.html">Tools</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../fixtures/fixtures.html">Fixtures</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../leagues/leagues.html">Leagues</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-lg-9">
                <!-- Planner Grid Area -->
                <div class="bg-dark p-3 rounded border border-secondary mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="d-flex align-items-center gap-3">
                            <h5 class="text-white fw-bold mb-0">Transfer Planner</h5>
                            <div class="input-group input-group-sm" style="width: 150px;">
                                <span class="input-group-text bg-secondary text-white border-secondary">Start FTs</span>
                                <input type="number" id="startFts" class="form-control bg-dark text-white border-secondary text-center" value="1" min="1" max="5">
                            </div>
                        </div>
                        <button class="btn btn-outline-light btn-sm" id="resetPlanBtn"><i class="fas fa-undo"></i> Reset</button>
                    </div>
                    
                    <div class="table-responsive">
                        <table id="plannerGrid" class="table table-dark table-bordered table-sm text-center align-middle planner-table" style="font-size: 0.85rem;">
                            <thead>
                                <tr id="plannerGridHeader">
                                    <th style="width: 25%; text-align: left;">Player</th>
                                    <!-- GW columns injected here -->
                                </tr>
                            </thead>
                            <tbody id="plannerGridBody">
                                <!-- Player rows injected here -->
                            </tbody>
                            <tfoot id="plannerGridFooter" class="table-active fw-bold">
                                <!-- Totals injected here -->
                            </tfoot>
                        </table>
                    </div>
                </div>


            </div>
            
            <div class="col-lg-3">
                <!-- Players Sidebar -->
                <div class="bg-dark p-3 rounded border border-secondary text-white h-100 d-flex flex-column">
                    <h5 class="fw-bold mb-3">Player Selection</h5>
                    
                    <div class="mb-2">
                        <div class="input-group input-group-sm mb-2">
                            <span class="input-group-text bg-secondary text-white border-secondary"><i class="fas fa-search"></i></span>
                            <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Search by name" id="plannerSearch">
                        </div>
                        
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <select class="form-select form-select-sm bg-dark text-white border-secondary" id="plannerViewFilter">
                                    <option value="all">All players</option>
                                    <optgroup label="Position">
                                        <option value="pos_1">Goalkeepers</option>
                                        <option value="pos_2">Defenders</option>
                                        <option value="pos_3">Midfielders</option>
                                        <option value="pos_4">Forwards</option>
                                    </optgroup>
                                </select>
                            </div>
                            <div class="col-6">
                                <select class="form-select form-select-sm bg-dark text-white border-secondary" id="plannerSortBy">
                                    <option value="total_points">Total points</option>
                                    <option value="event_points">Gameweek points</option>
                                    <option value="now_cost">Price</option>
                                    <option value="form">Form</option>
                                    <option value="selected_by_percent">Selected by %</option>
                                    <option value="expected_goal_involvements">xGI</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 pb-2 border-bottom border-secondary">
                            <div class="col-6">
                                <select class="form-select form-select-sm bg-dark text-white border-secondary" id="plannerMaxPrice">
                                    <option value="999">Max Price: Any</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-sm btn-outline-secondary w-100 text-white" id="plannerResetFilters"><i class="fas fa-undo"></i> Reset</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex text-white-50 small fw-bold px-2 mb-1 mt-2">
                        <div style="flex: 1;">Player</div>
                        <div style="width: 40px; text-align: center;">Price</div>
                        <div style="width: 40px; text-align: center;" id="plannerSortLabel">Pts</div>
                        <div style="width: 50px;"></div>
                    </div>

                    <div id="plannerPlayersList" class="overflow-auto flex-grow-1" style="max-height: 600px;">
                        <!-- Player list injected here -->
                        <div class="text-center text-white-50 mt-5">
                            <i class="fas fa-spinner fa-spin fs-2"></i>
                            <p class="mt-2">Loading players...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../api/requests.js"></script>
    <script src="../../helpers/helpers.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="../../data.js"></script>
    <script src="../../algorithms/predictPoints.js"></script>
    <!-- We will reuse some functions from script.js, or just redefine the lightweight ones needed for planner -->
    <script src="planner.js"></script>
</body>
</html>
