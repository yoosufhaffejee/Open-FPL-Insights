<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer & Chip Planner - Open FPL Insights</title>
    <link rel="icon" href="../../assets/favicon.png" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fontawesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../../style.css" rel="stylesheet">
    <link href="planner.css" rel="stylesheet">
</head>
<body class="planner-page" style="background-color: #121212;">
    <!-- Global Loader -->
    <div id="global-loader" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #121212; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.3s ease-out;">
        <div class="spinner-border text-success" role="status" style="width: 4rem; height: 4rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
        <h4 class="mt-4 text-white">Loading FPL Data... <span id="global-progress-text"></span></h4>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand" href="../../index.html">Open FPL Insights</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="../../index.html">Team</a>
                    </li>
                    <li class="nav-item" id="nav-managers-tab" style="display: none;">
                        <a class="nav-link" href="../managers/managers.html">Managers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../fdr/fdr.html">Fixture Ticker</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="../planner/planner.html">Planner</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../tools/tools.html">Tools</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../fixtures/fixtures.html">Fixtures</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../leagues/leagues.html">Leagues</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-lg-9">
                <!-- Planner Grid Area -->
                <div class="bg-dark p-3 rounded border border-secondary mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="text-white fw-bold mb-0">Transfer Planner</h5>
                    </div>
                    
                    <div class="table-responsive">
                        <table id="plannerGrid" class="table table-dark table-bordered table-sm text-center align-middle planner-table" style="font-size: 0.85rem;">
                            <thead>
                                <tr id="plannerGridHeader">
                                    <th style="width: 25%; text-align: left;">Player</th>
                                    <!-- GW columns injected here -->
                                </tr>
                            </thead>
                            <tbody id="plannerGridBody">
                                <!-- Player rows injected here -->
                            </tbody>
                            <tfoot id="plannerGridFooter" class="table-active fw-bold">
                                <!-- Totals injected here -->
                            </tfoot>
                        </table>
                    </div>
                </div>

                <!-- Chip Strategy -->
                <div class="bg-dark p-3 rounded border border-secondary mt-3 mb-5">
                    <h6 class="text-white fw-bold mb-3">Your chip strategy <i class="fas fa-lock text-muted small"></i></h6>
                    <div class="d-flex justify-content-between gap-2 text-center">
                        <div class="chip-card flex-fill p-3 rounded bg-secondary text-white" style="opacity: 0.5;">
                            <i class="fas fa-chair fs-4 mb-2"></i>
                            <div class="fw-bold small">Bench Boost</div>
                            <div class="small text-white-50">Not set</div>
                        </div>
                        <div class="chip-card flex-fill p-3 rounded bg-secondary text-white" style="opacity: 0.5;">
                            <i class="fas fa-sync-alt fs-4 mb-2"></i>
                            <div class="fw-bold small">Free Hit</div>
                            <div class="small text-white-50">Not set</div>
                        </div>
                        <div class="chip-card flex-fill p-3 rounded bg-secondary text-white" style="opacity: 0.5;">
                            <i class="fas fa-star fs-4 mb-2"></i>
                            <div class="fw-bold small">Wildcard</div>
                            <div class="small text-white-50">Not set</div>
                        </div>
                        <div class="chip-card flex-fill p-3 rounded bg-secondary text-white" style="opacity: 0.5;">
                            <i class="fas fa-copyright fs-4 mb-2"></i>
                            <div class="fw-bold small">Triple Captain</div>
                            <div class="small text-white-50">Not set</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-3">
                <!-- Players Sidebar -->
                <div class="bg-dark p-3 rounded border border-secondary text-white h-100">
                    <h5 class="fw-bold mb-3">Players</h5>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Search player..." id="plannerSearch">
                    </div>
                    
                    <div id="plannerPlayersList" class="overflow-auto" style="max-height: 700px;">
                        <!-- Player list injected here -->
                        <div class="text-center text-white-50 mt-5">
                            <i class="fas fa-spinner fa-spin fs-2"></i>
                            <p class="mt-2">Loading players...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../api/requests.js"></script>
    <script src="../../helpers/helpers.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="../../data.js"></script>
    <script src="../../algorithms/predictPoints.js"></script>
    <!-- We will reuse some functions from script.js, or just redefine the lightweight ones needed for planner -->
    <script src="planner.js"></script>
</body>
</html>
